
name: Daily cartoon video

on:
  workflow_dispatch:
  schedule:
    - cron: '15 17 * * *'

permissions:
  contents: read

jobs:
  create-cartoon:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt

      - name: Generate story
        run: |
          python story_generator.py --episode "$(python -c 'from datetime import date; print(date.today().toordinal())')" --output output/episode.json

      - name: Create animated video
        run: |
          python cartoon_video.py --input output/episode.json --output output/cartoon.mp4

      - name: Save video and story
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-${{ github.run_id }}
          path: |
            output/cartoon.mp4
            output/episode.json
          if-no-files-found: warn
          retention-days: 7
